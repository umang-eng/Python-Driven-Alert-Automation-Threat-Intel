<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc">
  <title id="title">Threat intelligence automation dashboard</title>
  <desc id="desc">A cyberpunk-inspired network grid with a central shield and automated threat-intelligence signals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07091d"/>
      <stop offset="0.52" stop-color="#13113a"/>
      <stop offset="1" stop-color="#071827"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="0.28" stop-color="#00e5ff"/>
      <stop offset="0.7" stop-color="#ff35d3"/>
      <stop offset="1" stop-color="#ff35d3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-pink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="72" height="48" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V48" fill="none" stroke="#13d9ef" stroke-opacity=".16" stroke-width="1"/>
    </pattern>
    <pattern id="microgrid" width="9" height="9" patternUnits="userSpaceOnUse">
      <path d="M9 0H0V9" fill="none" stroke="#ffffff" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <clipPath id="shield-clip"><path d="M720 91 815 127v77c0 75-50 132-95 157-45-25-95-82-95-157v-77z"/></clipPath>
  </defs>

  <rect width="1440" height="480" fill="url(#bg)"/>
  <rect width="1440" height="480" fill="url(#microgrid)"/>
  <ellipse cx="720" cy="294" rx="610" ry="170" fill="#00d9ff" opacity=".055"/>

  <!-- Perspective ground grid -->
  <g stroke="#00d9ff" stroke-opacity=".32" fill="none">
    <path d="M0 480 555 281M144 480 589 281M288 480 622 281M432 480 655 281M576 480 688 281M720 480V281M864 480 752 281M1008 480 785 281M1152 480 818 281M1296 480 851 281M1440 480 885 281"/>
    <path d="M0 454H1440M106 413H1334M216 377H1224M318 345H1122M420 318H1020M512 295H928M580 281H860"/>
  </g>
  <path d="M0 280H1440" stroke="url(#horizon)" stroke-width="2" filter="url(#glow-cyan)"/>

  <!-- Ambient data paths -->
  <g fill="none" stroke-linecap="round">
    <path d="M80 157H253l34 34h174" stroke="#00e5ff" stroke-opacity=".55" stroke-width="1.5"/>
    <path d="M1360 143h-173l-36 36H981" stroke="#ff35d3" stroke-opacity=".55" stroke-width="1.5"/>
    <path d="M160 229h150l28-28h132" stroke="#a855f7" stroke-opacity=".42"/>
    <path d="M1280 235h-151l-27-27H970" stroke="#00e5ff" stroke-opacity=".42"/>
  </g>
  <g filter="url(#glow-cyan)">
    <circle cx="253" cy="157" r="4" fill="#00e5ff"/>
    <circle cx="461" cy="191" r="3" fill="#00e5ff"/>
    <circle cx="338" cy="201" r="3" fill="#a855f7"/>
    <circle cx="1151" cy="179" r="3" fill="#ff35d3"/>
    <circle cx="1102" cy="208" r="3" fill="#00e5ff"/>
  </g>

  <!-- Central shield -->
  <path d="M720 91 815 127v77c0 75-50 132-95 157-45-25-95-82-95-157v-77z" fill="#0b1d37" fill-opacity=".9" stroke="url(#shield)" stroke-width="3" filter="url(#glow-cyan)"/>
  <g clip-path="url(#shield-clip)">
    <path d="M620 126h200M619 155h202M618 185h204M620 215h200M625 245h190" stroke="#00e5ff" stroke-opacity=".14"/>
    <path d="M642 105 790 255M670 95l145 145M615 160l151 151" stroke="#ff35d3" stroke-opacity=".13" stroke-width="2"/>
  </g>
  <path d="M690 190v-15a30 30 0 0 1 60 0v15" fill="none" stroke="#e9fbff" stroke-width="7" stroke-linecap="round"/>
  <rect x="680" y="190" width="80" height="62" rx="8" fill="#0b1934" stroke="#e9fbff" stroke-width="4"/>
  <circle cx="720" cy="217" r="7" fill="#00e5ff" filter="url(#glow-cyan)"/>
  <path d="M720 224v12" stroke="#00e5ff" stroke-width="4" stroke-linecap="round"/>

  <!-- Left telemetry -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.5">
    <text x="92" y="94" fill="#00e5ff" font-size="12">AUTOMATED TRIAGE</text>
    <text x="92" y="118" fill="#8da1c7" font-size="10">EXTRACT  /  ENRICH  /  RESPOND</text>
    <path d="M92 132h251" stroke="#00e5ff" stroke-opacity=".45"/>
    <text x="92" y="190" fill="#e9fbff" font-size="17" font-weight="700">SIGNAL INTAKE</text>
    <text x="92" y="215" fill="#8da1c7" font-size="11">PUBLIC IPS  ·  MD5  ·  SHA-256</text>
    <text x="92" y="247" fill="#00e5ff" font-size="11">[✓] JSONL LOG STREAMS</text>
  </g>

  <!-- Right telemetry -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.5">
    <text x="1045" y="94" fill="#ff59d9" font-size="12">THREAT INTELLIGENCE</text>
    <text x="1045" y="118" fill="#8da1c7" font-size="10">REPUTATION  /  RISK  /  ACTION</text>
    <path d="M1045 132h296" stroke="#ff35d3" stroke-opacity=".45"/>
    <text x="1045" y="190" fill="#e9fbff" font-size="17" font-weight="700">ACTIVE DEFENSE</text>
    <text x="1045" y="215" fill="#8da1c7" font-size="11">VIRUSTOTAL + ABUSEIPDB</text>
    <text x="1045" y="247" fill="#ff59d9" font-size="11">[✓] ACTIONABLE REPORTS</text>
  </g>

  <!-- Title lockup -->
  <g text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="720" y="373" fill="#f4f8ff" font-size="25" font-weight="700" letter-spacing="5">THREAT INTEL AUTOMATION</text>
    <text x="720" y="401" fill="#8da1c7" font-size="11" letter-spacing="3">PYTHON-DRIVEN ALERT TRIAGE PIPELINE</text>
  </g>
  <g filter="url(#glow-pink)">
    <path d="M515 421h90M835 421h90" stroke="#ff35d3" stroke-width="2"/>
  </g>
  <path d="M625 421h190" stroke="#00e5ff" stroke-width="2" filter="url(#glow-cyan)"/>
</svg>
